<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シンプルなWebサイト</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding-bottom: 120px;
      font-family: Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      background-color: #f5f5f5;
    }

    /* ヘッダー */
    header {
      background-color: #440000;
      color: white;
      text-align: center;
      padding: 30px 20px;
    }

    header h1 {
      margin: 0;
    }

    /* メイン */
    main {
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      color: #cc0000;
    }

    section {
      background-color: white;
      margin-bottom: 30px;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    section h2 {
      margin-top: 0;
      color: #cc0000;
    }

    /* フッター */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 15px 20px;
      background-color: #440000;
      color: white;
      text-align: center;
    }

    footer p {
      margin: 0 0 8px;
    }

    /* ソーシャルメディアリンク */
    .social-links a {
      color: white;
      margin: 0 10px;
      text-decoration: none;
    }

    .social-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <!-- ヘッダー -->
  <header>
    <h1>私のおすすめ旅行先WEBサイト</h1>
  </header>

  <!-- メインコンテンツ -->
  <main>

    <section>
      <h2>私がおすすめする旅行先</h2>
      <p>
        １．台湾：本当にご飯がおいしい。ジブリを感じることが出来る<br>
        ２．タイ：象に乗って観光するのが楽しい。<br>
        ３．北海道：どこのお店に行ってもご飯がおいしい。居酒屋のご飯が特においしい
      </p>
      <img src="画像のリンク" alt="サンプル">
    </section>

    <section>
      <h2>これから行ってみたい旅行先</h2>
      <p>
        アメリカディズニーに行きたい<br>
        フランスに行きたい
      </p>
    </section>

  </main>

  <!-- フッター -->
  <footer>
    <p>お問い合わせ：info@example.com</p>

    <div class="social-links">
      <a href="#">X</a>
      <a href="#">Instagram</a>
      <a href="#">Facebook</a>
    </div>
  </footer>

</body>
</html>
